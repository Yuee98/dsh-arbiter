name: DSH E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsh-e2e:
    name: Real DSH browser smoke
    runs-on: [self-hosted, dsh-e2e]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: '2026.10.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install chromium
      - name: Run isolated real DSH smoke
        run: pnpm test:e2e:dsh
      - name: Save browser and host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-e2e-${{ github.run_id }}
          path: .local/e2e/
          if-no-files-found: warn
          retention-days: 7
