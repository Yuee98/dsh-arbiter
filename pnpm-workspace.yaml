# Tool settings for this single-package project.
packages:
  - .
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
packageManagerStrictVersion: true
saveExact: true
strictPeerDependencies: true
verifyDepsBeforeRun: error
